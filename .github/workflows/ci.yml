name: CI Quality Gates

on:
  push:
    branches: [main, master, feat/*, fix/*]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    name: Mandatory Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture check
        run: node scripts/check-architecture.cjs

      - name: Architecture guard test
        run: npm run test:guard

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Full test suite & architecture guard
        run: npm test

      - name: Secrets check
        run: npm run check:secrets
